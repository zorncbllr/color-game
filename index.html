<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Color Cube Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #fff;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      #canvas-container {
        width: 100%;
        height: 70vh;
        position: relative;
      }

      #controls {
        display: flex;
        gap: 20px;
        margin: 30px 0;
      }

      button {
        padding: 16px 40px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      #roll-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      #roll-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
      }

      #roll-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      #reset-btn {
        background: #1a1a1a;
        color: white;
        border: 2px solid #333;
      }

      #reset-btn:hover {
        background: #2a2a2a;
        border-color: #555;
      }

      #result {
        display: flex;
        gap: 30px;
        align-items: center;
        min-height: 60px;
        opacity: 0;
        transition: opacity 0.5s ease;
      }

      #result.show {
        opacity: 1;
      }

      .color-result {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .color-box {
        width: 60px;
        height: 60px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .color-name {
        font-size: 14px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="controls">
      <button id="roll-btn">Roll Cubes</button>
      <button id="reset-btn">Reset</button>
    </div>

    <div id="result"></div>
    <script src="three.js"></script>
    <script src="script.js"></script>
  </body>
</html>
